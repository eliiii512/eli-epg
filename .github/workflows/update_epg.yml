name: Run HOT EPG

on:
  schedule:
    - cron: '0 6 * * *' # רץ כל יום בשעה 06:00
  workflow_dispatch: # מאפשר הרצה ידנית מתוך GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run update_epg.py
        run: python update_epg.py
