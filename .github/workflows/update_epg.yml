name: Run HOT EPG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps
          sudo apt-get update && sudo apt-get install -y openvpn unzip

      - name: Connect to IPVanish Israel VPN
        env:
          IPV_USER: ${{ secrets.IPV_USER }}
          IPV_PASS: ${{ secrets.IPV_PASS }}
        run: |
          # 1. יצירת קובץ האימות מתוך ה-Secrets
          echo "$IPV_USER" > auth.txt
          echo "$IPV_PASS" >> auth.txt

          # 2. הורדת תעודת האבטחה הקטנה של IPVanish (ca.crt)
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          curl -sSL -A "$UA" "https://configs.ipvanish.com/configs/ca.ipvanish.com.crt" -o ca.ipvanish.com.crt

          # 3. יצירת קובץ הקונפיגורציה הישראלי ישירות בסקריפט
          cat << 'EOF' > israel.ovpn
          client
          dev tun
          proto udp
          remote tlv-c23.ipvanish.com 443
          remote tlv-c01.ipvanish.com 443
          resolv-retry infinite
          nobind
          persist-key
          persist-tun
          ca ca.ipvanish.com.crt
          auth-user-pass auth.txt
          verb 3
          EOF

          echo "מפעיל את OpenVPN מול שרת תל אביב..."

          # 4. הפעלת OpenVPN ברקע
          sudo openvpn --config israel.ovpn --daemon

          # 5. המתנה להתייצבות החיבור
          sleep 12

          # 6. בדיקת מיקום ה-IP החדש
          curl -s https://ipinfo.io/json

      - name: Run update_epg.py
        run: python update_epg.py

      - name: Commit and push epg.xml
        run: |
          if [ -f epg.xml ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add epg.xml
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPG data [skip ci]" && git push)
          fi
