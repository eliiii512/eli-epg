שגיאת המרת זמן

הבעיה נובעת מכך שספריית zoneinfo המובנית בפייתון נעזרת במסד הנתונים של מערכת ההפעלה (tzdata) כדי לזהות אזורי זמן כמו Asia/Jerusalem. מכיוון שאנחנו סביבת Windows, חבילת הנתונים הזו לא מותקנת כברירת מחדל ולכן מתקבלת השגיאה No time zone found with key Asia/Jerusalem.

פתרון קליל ואלגנטי הוא להתקין את ספריית tzdata הרשמית לפייתון שמוסיפה את כל אזורי הזמן ישירות.

איך מתקנים?
היכנס ללשונית Terminal בתחתית PyCharm.

הרץ את הפקודה הבאה:

Bash
pip install tzdata
ברגע שההתקנה תסתיים, לחץ שוב על כפתור ה־Run (Play) הירוק – כל שגיאות אזור הזמן ייעלמו, והסקריפט ימיר את הזמנים ויציג את לוח השידורים המלא בצורה מושלמת!

החלק הזה יהיה ב-GITHUB או באפליקציה?





private fun formatHotTime(timeStr: String): String {

return try {

if (timeStr.isBlank()) return ""

// הוט שולחים את הזמנים בפורמט "yyyy/MM/dd HH:mm:ss" לפי שעון מקומי (ישראל)

val formatter = DateTimeFormatter.ofPattern("yyyy/MM/dd HH:mm:ss")

val localDateTime = LocalDateTime.parse(timeStr, formatter)



// הגדרת אזור הזמן של ישראל (מתמודד לבד עם שעון קיץ/חורף לפי התאריך)

val israelZone = ZoneId.of("Asia/Jerusalem")



