name: Run HOT EPG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps
          sudo apt-get update && sudo apt-get install -y openvpn unzip

      - name: Connect to IPVanish Israel VPN
        env:
          IPV_USER: ${{ secrets.IPV_USER }}
          IPV_PASS: ${{ secrets.IPV_PASS }}
        run: |
          # 1. יצירת קובץ האימות
          echo "$IPV_USER" > auth.txt
          echo "$IPV_PASS" >> auth.txt

          # 2. הורדת קבצי הקונפיגורציה תוך מעקב אחר הפניות (-fL)
          curl -sfL "https://configs.ipvanish.com/configs/configs.zip" -o configs.zip || \
          curl -sfL "https://www.ipvanish.com/software/configs/configs.zip" -o configs.zip

          # 3. חילוץ הקבצים
          unzip -q configs.zip

          # 4. איתור קובץ התצורה הישראלי
          CONFIG_FILE=$(ls ipvanish-IL*.ovpn 2>/dev/null | head -n 1)
          if [ -z "$CONFIG_FILE" ]; then
            CONFIG_FILE=$(ls *tlv*.ovpn 2>/dev/null | head -n 1)
          fi

          echo "Connecting using config: $CONFIG_FILE"

          # 5. הפעלת OpenVPN ברקע
          sudo openvpn --config "$CONFIG_FILE" --auth-user-pass auth.txt --daemon

          # 6. המתנה להתייצבות חיבור ה-VPN
          sleep 12

          # 7. בדיקת מיקום ה-IP החדש
          curl -s https://ipinfo.io/json

      - name: Run update_epg.py
        run: python update_epg.py

      - name: Commit and push epg.xml
        run: |
          if [ -f epg.xml ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add epg.xml
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPG data [skip ci]" && git push)
          fi
