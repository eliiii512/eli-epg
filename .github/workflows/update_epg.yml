  workflow_dispatch: # מאפשר גם הרצה ידנית מתוך לשונית Actions באתר GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
