package com.example.iptvstream



import kotlinx.coroutines.Dispatchers

import kotlinx.coroutines.withContext

import org.json.JSONArray

import java.time.LocalDate

import java.time.LocalDateTime

import java.time.ZoneId

import java.time.format.DateTimeFormatter

import android.util.Log

import org.jsoup.Connection

import org.jsoup.Jsoup



object ChannelRepositoryHot {



suspend fun fetchHotEpg(channel: Channel): List<EpgProgram> = withContext(Dispatchers.IO) {

val programs = mutableListOf<EpgProgram>()



try {

val formatter = DateTimeFormatter.ofPattern("yyyy/MM/dd")

val today = LocalDate.now()

val startDateStr = "${today.format(formatter)} 00:00:00"

val endDateStr = "${today.format(formatter).let { LocalDate.parse(it, formatter).plusDays(5).format(formatter) }} 23:59:59"



val requestBodyJson = org.json.JSONObject().apply {

put("ProgramsStartDateTime", startDateStr)

put("ProgramsEndDateTime", endDateStr)

}.toString()



val url = "https://www.hot.net.il/HotCmsApiFront/api/ProgramsSchedual/GetProgramsSchedual"



Log.d("HOT_DEBUG", "מתחיל הורדת לוח שידורים עבור ערוץ: ${channel.name} (ID: ${channel.epgId})")



val responseBody = Jsoup.connect(url)

.method(Connection.Method.POST)

.requestBody(requestBodyJson)

.header("Host", "www.hot.net.il")

.header("Origin", "https://www.hot.net.il")

.header("Referer", "https://www.hot.net.il/heb/tv/tvguide/")

.header("Content-Type", "application/json")

.header("Accept", "application/json, text/plain, */*")

.header("Accept-Language", "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7")

.userAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36")

.ignoreContentType(true)

.ignoreHttpErrors(true)

.maxBodySize(0)

.execute()

.body()



Log.d("HOT_DEBUG", "הורדת הנתונים הסתיימה בהצלחה. מעבד נתונים עבור ${channel.name}...")



val jsonArray = try {

val jsonObject = org.json.JSONObject(responseBody)

jsonObject.optJSONObject("data")?.optJSONArray("programsDetails") ?: JSONArray(responseBody)

} catch (e: Exception) {

JSONArray(responseBody)

}



var matchCount = 0

for (i in 0 until jsonArray.length()) {

val item = jsonArray.getJSONObject(i)

val channelId = item.optString("channelID", "")



if (channelId == channel.epgId) {

val title = item.optString("programTitle", "").trim()

val rawDesc = item.optString("synopsis", "").trim()

val desc = if (rawDesc.length > 80) rawDesc.take(80).trim() + "..." else rawDesc.trim()



val rawStart = item.optString("programStartTime", "")

val rawEnd = item.optString("programEndTime", "")



val startTime = formatHotTime(rawStart)

val endTime = formatHotTime(rawEnd)



// טיפול בשמות ותוספת פרקים בהתאם לערוץ

val fullTitle = when (channel.epgId) {

"127", "215" -> {

val episode = item.optString("programEpisode", "").trim()

if (episode.isNotEmpty() && episode != "0") "$title - פרק $episode" else title

}

"151" -> {

// ערוץ 151 - ללא פרקים

title

}

else -> title

}



if (fullTitle.isNotEmpty() && startTime.isNotEmpty() && endTime.isNotEmpty()) {

matchCount++

Log.d("HOT_DEBUG", "מצאתי תוכנית [$matchCount]: '$fullTitle' | התחלה: $startTime | סיום: $endTime")

programs.add(EpgProgram(fullTitle, desc, startTime, endTime, channel.epgId, ""))

}

}

}



Log.d("HOT_DEBUG", "סיום עיבוד ערוץ ${channel.name}. נמצאו בסך הכל ${programs.size} תוכניות.")



} catch (e: Exception) {

Log.e("HOT_DEBUG", "שגיאה בניתוח נתוני HOT לערוץ ${channel.epgId}: ${e.message}")

e.printStackTrace()

}



return@withContext programs

}



private fun formatHotTime(timeStr: String): String {

return try {

if (timeStr.isBlank()) return ""

// הוט שולחים את הזמנים בפורמט "yyyy/MM/dd HH:mm:ss" לפי שעון מקומי (ישראל)

val formatter = DateTimeFormatter.ofPattern("yyyy/MM/dd HH:mm:ss")

val localDateTime = LocalDateTime.parse(timeStr, formatter)



// הגדרת אזור הזמן של ישראל (מתמודד לבד עם שעון קיץ/חורף לפי התאריך)

val israelZone = ZoneId.of("Asia/Jerusalem")



// המרה מדויקת משעון ישראל ל־UTC שהאפליקציה מצפה לקבל

localDateTime.atZone(israelZone)

.withZoneSameInstant(ZoneId.of("UTC"))

.format(DateTimeFormatter.ofPattern("yyyyMMddHHmmss"))



} catch (e: Exception) {

Log.e("HOT_DEBUG", "שגיאת המרת זמן עבור '$timeStr': ${e.message}")

timeStr.replace(Regex("[^0-9]"), "").take(14)

}

}

}

מעולה! תרגמנו את קוד הקוטלין (Kotlin) המדויק של אנדרואיד ישירות לסקריפט פייתון נקי ומקביל שמשתמש בדיוק באותה לוגיקה (requests / פונקציות המרת זמן של ישראל/UTC וסינון לפי channelID).

ב־PyCharm, מחק את כל מה שכתוב כרגע בקובץ הדיפולטיבי (מה שקיבלת עם ה־print_hi), הדבק במקום זאת את הקוד הבא, ולחץ על כפתור ה־Play (Run) הירוק:

Python
from datetime import datetime
import json
import requests
from zoneinfo import ZoneInfo  # מובנה בפייתון מגרסה 3.9 ומעלה


def format_hot_time(time_str: str) -> str:
  try:
    if not time_str or not time_str.strip():
      return ''
    # המרת הזמן המקומי של ישראל ל־UTC בהתאם ללוגיקה שקיימת בקוטלין
    dt_local = datetime.strptime(time_str.strip(), '%Y/%m/%d %H:%M:%S')
    dt_israel = dt_local.replace(tzinfo=ZoneInfo('Asia/Jerusalem'))
    dt_utc = dt_israel.astimezone(ZoneInfo('UTC'))
    return dt_utc.strftime('%Y%m%d%H%M%S')
  except Exception as e:
    print(f"שגיאת המרת זמן עבור '{time_str}': {e}")
    return ''.join(filter(str.isdigit, time_str))[:14]


def fetch_hot_epg():
  # הגדרת תאריכים בדיוק כמו בקוד של אנדרואיד (היום + 5 קדימה)
  today = datetime.now()
  start_date_str = today.strftime('%Y/%m/%d 00:00:00')
  end_date_str = (
      datetime.now().replace(hour=23, minute=59, second=59)
      .fromordinal(today.toordinal() + 5)
      .strftime('%Y/%m/%d 23:59:59')
  )

  # אפשר גם פשוט לתת טווח קבוע לצורך בדיקה מהירה:
  # start_date_str = "2026/08/17 00:00:00"
  # end_date_str = "2026/08/22 23:59:59"

  url = 'https://www.hot.net.il/HotCmsApiFront/api/ProgramsSchedual/GetProgramsSchedual'

  payload = {
      'ProgramsStartDateTime': start_date_str,
      'ProgramsEndDateTime': end_date_str,
  }

  headers = {
      'Host': 'www.hot.net.il',
      'Origin': 'https://www.hot.net.il',
      'Referer': 'https://www.hot.net.il/heb/tv/tvguide/',
      'Content-Type': 'application/json',
      'Accept': 'application/json, text/plain, */*',
      'Accept-Language': 'he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7',
      'User-Agent': (
          'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,'
          ' like Gecko) Chrome/151.0.0.0 Safari/537.36'
      ),
  }

  print(f'מתחיל הורדת לוח שידורים לטווח: {start_date_str} עד {end_date_str}')

  try:
    # שימוש ב־requests עוקף את בעיות ה־302 ומטפל בקידוד ובקוקיז בצורה מושלמת
    response = requests.post(url, json=payload, headers=headers, timeout=30)
    print(f'סטטוס תגובה מהשרת: {response.status_code}')

    if response.status_code != 200:
      print('תוכן התגובה החריגה:', response.text[:300])
      return

    res_json = response.json()

    # חילוץ מערך התוכניות בדיוק כמו בקוטלין
    if (
        isinstance(res_json, dict)
        and 'data' in res_json
        and res_json['data']
        and 'programsDetails' in res_json['data']
    ):
      programs_list = res_json['data']['programsDetails']
    elif isinstance(res_json, list):
      programs_list = res_json
    else:
      programs_list = res_json

    print(f'סך הכל פריטים שהתקבלו מהשרת: {len(programs_list)}')

    # בדיקת ערוצים לדוגמה
    target_channels = ['127', '215', '151']

    for channel_id in target_channels:
      match_count = 0
      print(f'\n--- בדיקת ערוץ ID: {channel_id} ---')

      for item in programs_list:
        if str(item.get('channelID', '')) == channel_id:
          title = item.get('programTitle', '').strip()
          raw_desc = item.get('synopsis', '').strip()
          desc = (
              (raw_desc[:80].strip() + '...')
              if len(raw_desc) > 80
              else raw_desc.strip()
          )

          raw_start = item.get('programStartTime', '')
          raw_end = item.get('programEndTime', '')

          start_time = format_hot_time(raw_start)
          end_time = format_hot_time(raw_end)

          # התאמת שמות פרקים לפי הערוץ
          if channel_id in ['127', '215']:
            episode = str(item.get('programEpisode', '')).strip()
            if episode and episode != '0':
              full_title = f'{title} - פרק {episode}'
            else:
              full_title = title
          else:
            full_title = title

          if full_title and start_time and end_time:
            match_count += 1
            if match_count <= 3:  # נדפיס את הראשונים להמחשה
              print(
                  f"  תוכנית [{match_count}]: '{full_title}' | התחלה:"
                  f' {start_time} | סיום: {end_time}'
              )

      print(מצאת תוכניות לערוץ {channel_id}: {match_count})

  except Exception as e:
    print(f'שגיאה בתהליך: {e}')


if __name__ == '__main__':
  fetch_hot_epg()
