name: Run HOT EPG

on:
  schedule:
    - cron: '0 6 * * *' # רץ כל יום בשעה 06:00
  workflow_dispatch: # מאפשר הרצה ידנית מתוך GitHub

permissions:
  contents: write # חובה כדי שה-Action יוכל להעלות את הקובץ חזרה למאגר

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run update_epg.py
        run: python update_epg.py

      - name: Commit and push epg.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          # הקוד הבא מבצע דחיפה לגיטהאב רק אם הקובץ באמת השתנה
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPG data [skip ci]" && git push)
